name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22
          - 24
          - 26
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm test:prettier

      - name: Lint
        run: pnpm test:lint

      - name: Type-check
        run: pnpm test:tsc

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image without pushing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          push: false
          load: true
          tags: discord-ai-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the image refuses to start without a token
        run: |
          set +e
          output=$(timeout 60 docker run --rm --network none discord-ai-bot:ci 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "::error::The container exited with status 0 even though no token was set."
            exit 1
          fi
          if ! grep -qF "TOKEN or DISCORD_TOKEN environment variable is required" <<< "$output"; then
            echo "::error::The container exited with status $status but did not report the missing token."
            exit 1
          fi
          echo "The container exited with status $status and reported the missing token."

      - name: Check every bot module loads in the image
        run: |
          set +e
          output=$(timeout 60 docker run --rm --network none -e TOKEN=placeholder -e OLLAMA=http://127.0.0.1:11434 discord-ai-bot:ci node dist/bot.js 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if ! grep -qF "Failed to login to Discord" <<< "$output"; then
            echo "::error::The bot exited with status $status before trying to log in, so a module failed to load in the image."
            exit 1
          fi
          echo "Every bot module loaded and the offline login failed as expected."
